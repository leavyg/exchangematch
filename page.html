<title>ExchangeMatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* ExchangeMatch. One typeface (Schibsted Grotesk). A navy "night flight" panel holds the choices and a live
   result sentence; results are two separate tabs (School / College-wide) of compact cards; details open in a drawer.
   School = cobalt, College-wide = violet, green = fits your pathway, amber = check details. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#14203A; --muted:#566278; --line:#D8DEE7; --line-2:#BCC6D3;
  --night:#11224D; --night-2:#1B3166; --on-night:#FFFFFF; --on-night-muted:#A9B9DA; --night-line:rgba(255,255,255,.14);
  --school:#2B4ECF; --school-soft:#E7ECFC; --school-on-night:#A9BEFF;
  --college:#7A3BBF; --college-soft:#F1E9FB; --college-on-night:#D6B8FF;
  --accent:var(--school); --accent-ink:#FFFFFF;
  --good:#14724A; --good-soft:#E3F2EA; --good-line:#9ED0B5;
  --warn:#94570A; --warn-soft:#FBF0DC; --warn-line:#E6BE7C;
  --bad:#AC3A2F; --bad-soft:#F9E7E4;
  --fav:#D1325E; --fav-soft:#FCE8EE; --fav-line:#EFA6BA;
  --scrim:rgba(12,20,38,.42); --shadow:0 24px 60px rgba(12,20,38,.20); --lift:0 1px 2px rgba(12,20,38,.06);
  --f:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r:12px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#131C30; --sunk:#18223A; --ink:#E6EBF4; --muted:#9AA6BC; --line:#26314A; --line-2:#3A4763;
  --night:#162A5C; --night-2:#1F3672; --on-night-muted:#B3C2E2; --night-line:rgba(255,255,255,.16);
  --school:#8EA6FF; --school-soft:#1B2650; --college:#C7A2F6; --college-soft:#2A1E44;
  --accent:#8EA6FF; --accent-ink:#0B1222;
  --good:#5CCB98; --good-soft:#102A1F; --good-line:#2C6A4D;
  --warn:#E7AA55; --warn-soft:#2E2312; --warn-line:#6F5226;
  --bad:#F08C81; --bad-soft:#331B1A;
  --fav:#FF7FA0; --fav-soft:#3A1A26; --fav-line:#7C3449;
  --scrim:rgba(0,0,0,.6); --shadow:0 24px 60px rgba(0,0,0,.55); --lift:none;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#131C30; --sunk:#18223A; --ink:#E6EBF4; --muted:#9AA6BC; --line:#26314A; --line-2:#3A4763;
  --night:#162A5C; --night-2:#1F3672; --on-night-muted:#B3C2E2; --night-line:rgba(255,255,255,.16);
  --school:#8EA6FF; --school-soft:#1B2650; --college:#C7A2F6; --college-soft:#2A1E44;
  --accent:#8EA6FF; --accent-ink:#0B1222;
  --good:#5CCB98; --good-soft:#102A1F; --good-line:#2C6A4D;
  --warn:#E7AA55; --warn-soft:#2E2312; --warn-line:#6F5226;
  --bad:#F08C81; --bad-soft:#331B1A;
  --fav:#FF7FA0; --fav-soft:#3A1A26; --fav-line:#7C3449;
  --scrim:rgba(0,0,0,.6); --shadow:0 24px 60px rgba(0,0,0,.55); --lift:none;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;font-feature-settings:"tnum" 0;
  -webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 40px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.015em;line-height:1.15}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--muted)}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.mark{width:32px;height:32px;flex-shrink:0}
.brand b{font-size:1.18rem;font-weight:800;letter-spacing:-.03em}
.nav{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--lift)}
.nav button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:999px;padding:7px 15px;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer}
.nav button svg{width:15px;height:15px}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav b{font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--ink);border-radius:999px;padding:0 7px;font-size:.76rem;min-width:20px;text-align:center;line-height:1.55}
.nav button[aria-current="page"] b{background:var(--fav);color:#fff}

/* ---------- Screen 1: the night panel ---------- */
.hero{position:relative;overflow:hidden;background:var(--night);color:var(--on-night);border-radius:var(--r-lg);padding:clamp(24px,4.5vw,52px)}
.hero::after{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.13);pointer-events:none}
.hero::before{content:"";position:absolute;right:135px;top:355px;width:10px;height:10px;border-radius:50%;background:var(--school-on-night);box-shadow:0 0 0 6px rgba(169,190,255,.18);pointer-events:none}
.hero h1{font-size:clamp(2rem,4.6vw,3.35rem);font-weight:800;letter-spacing:-.035em;max-width:20ch;position:relative}
.hform{display:grid;gap:16px;margin-top:clamp(22px,3vw,34px);max-width:820px;position:relative;z-index:1}
.row{display:grid;gap:12px}
.row.two{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:grid;gap:6px;min-width:0}
.field>label,.flabel{font-size:.8rem;font-weight:600;color:var(--muted)}
.hero .field>label,.hero .flabel{color:var(--on-night-muted)}
.select{position:relative}
.select::after,.msel-btn::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select select,.msel-btn{appearance:none;-webkit-appearance:none;width:100%;padding:12px 40px 12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:500;font-size:.96rem;cursor:pointer;text-overflow:ellipsis;color:var(--ink)}
.msel-btn{text-align:left;white-space:nowrap;overflow:hidden;position:relative;display:block}
.select select:hover,.msel-btn:hover{border-color:var(--line-2)}
.hero .select select,.hero .msel-btn{border-color:transparent}
.select select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hero :focus-visible{outline-color:#fff}
.msel{position:relative}
.msel-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.msel-btn .ph{color:var(--muted);font-weight:400}
.msel-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:max(100%,230px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:grid;gap:1px}
.msel-pop label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:.92rem}
.msel-pop label:hover{background:var(--sunk)}
.msel-pop input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.msel-pop .fixed{color:var(--muted);cursor:default}
.msel-pop .fixed:hover{background:none}
.msel-pop .mclear{border:0;border-top:1px solid var(--line);background:none;color:var(--accent);text-align:left;padding:8px 10px 4px;font-size:.86rem;font-weight:600;cursor:pointer;margin-top:4px}
.sub{padding:14px;border-radius:var(--r);background:var(--night-2);display:grid;gap:12px}
.sub .flabel{display:block;margin-bottom:8px}
.seg{display:inline-flex;flex-wrap:wrap;border-radius:var(--r);background:rgba(255,255,255,.08);padding:3px;gap:3px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt label{display:block;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:.9rem;color:var(--on-night)}
.opt input:checked + label{background:var(--surface);color:var(--ink)}
.opt input:focus-visible + label{outline:2px solid #fff;outline-offset:2px}

.result{position:relative;z-index:1;margin-top:clamp(26px,3.5vw,40px);padding-top:clamp(20px,3vw,28px);border-top:1px solid var(--night-line);
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px 32px;flex-wrap:wrap}
.sentence{font-size:clamp(1.15rem,2.1vw,1.55rem);font-weight:500;line-height:1.35;letter-spacing:-.015em;max-width:34ch;margin:0;color:var(--on-night-muted)}
.sentence .who{color:var(--on-night);font-weight:700}
.sentence b{font-weight:800;font-variant-numeric:tabular-nums;color:var(--on-night);font-size:1.25em;letter-spacing:-.03em}
.sentence .s b{color:var(--school-on-night)} .sentence .c b{color:var(--college-on-night)}
.sentence .s,.sentence .c{white-space:nowrap}
.go{background:#fff;color:var(--night);border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:1rem;cursor:pointer;flex-shrink:0}
.go:hover{background:#E6ECFF}
.go:disabled{opacity:.55;cursor:default}
.data-status{font-size:.88rem;color:var(--on-night-muted);margin:0}

/* ---------- Screen 1b: results ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 12px;margin-top:-4px}
.toolbar{display:flex;align-items:flex-end;gap:10px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--lift)}
.toolbar .field{gap:4px}
.toolbar .field>label,.toolbar .flabel{font-size:.74rem}
.toolbar .select select,.toolbar .msel-btn{padding:8px 34px 8px 11px;font-size:.9rem;border-radius:10px;background:var(--sunk);border-color:var(--sunk)}
.toolbar .select select:hover,.toolbar .msel-btn:hover{border-color:var(--line-2)}
.toolbar .select::after,.toolbar .msel-btn::after{right:13px;width:6px;height:6px}
.toolbar .f-path{flex:1 1 300px;max-width:380px}
.toolbar .f-sm{flex:0 1 170px;min-width:130px}
.toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.tb-end{margin-left:auto;display:flex;gap:6px;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);font-size:.86rem;font-weight:600;cursor:pointer;padding:8px 6px}
.linkbtn:hover{text-decoration:underline}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--ink)}
.ghost:hover{border-color:var(--line-2);background:var(--sunk)}

.views{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:14px 0 18px;border-bottom:1px solid var(--line)}
.view-btn{text-align:left;border:0;background:none;padding:12px 4px 14px;cursor:pointer;display:grid;gap:1px;position:relative;color:var(--muted)}
.view-btn .t{font-weight:700;font-size:1.12rem;display:flex;align-items:center;gap:10px;letter-spacing:-.015em}
.view-btn .n{font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.view-btn small{font-size:.84rem}
.view-btn::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:transparent}
.view-btn:hover{color:var(--ink)}
.view-btn[aria-selected="true"]{color:var(--ink)}
.view-btn[aria-selected="true"].school::after{background:var(--school)}
.view-btn[aria-selected="true"].college::after{background:var(--college)}
.view-btn[aria-selected="true"].school .n{background:var(--school);color:var(--accent-ink);border-color:var(--school)}
.view-btn[aria-selected="true"].college .n{background:var(--college);color:#fff;border-color:var(--college)}
:root[data-theme="dark"] .view-btn[aria-selected="true"].college .n{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .view-btn[aria-selected="true"].college .n{color:var(--bg)}}

.tools{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:7px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface)}
.sw.ok{background:var(--good-soft);border-color:var(--good-line)}
.sort{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.sort select{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:.86rem;font-weight:600;color:var(--ink);cursor:pointer}
.section-h{font-weight:700;font-size:1rem;margin:26px 0 2px;display:flex;align-items:baseline;gap:8px;letter-spacing:-.01em}
.section-h span{font-weight:500;font-size:.86rem;color:var(--muted)}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.cw{position:relative;display:flex;min-width:0}
.card{all:unset;box-sizing:border-box;cursor:pointer;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 52px 13px 15px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--lift);transition:border-color .12s}
.card:hover{border-color:var(--line-2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.ok{background:var(--good-soft);border-color:var(--good-line)}
.card.ok:hover{border-color:var(--good)}
.c-name{font-weight:700;font-size:1rem;line-height:1.28;letter-spacing:-.012em}
.c-city{font-size:.86rem;color:var(--muted);margin-top:2px}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.terms{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.card.ok .chip{background:var(--surface)}
.chip.off{color:var(--muted);text-decoration:line-through;font-weight:500;background:transparent;padding-inline:4px}
.c-places{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-places b{color:var(--ink);font-weight:700}
.ic{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0}
.ic svg{width:11px;height:11px}
.ic.ok{background:var(--good);color:var(--surface)}
.ic.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.ic.q{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.marks{display:inline-flex;gap:3px;vertical-align:-3px;margin-left:6px;white-space:nowrap}
.heart{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.heart:hover{color:var(--fav);border-color:var(--fav-line)}
.heart svg{width:15px;height:15px}
.heart.on{color:var(--fav);border-color:var(--fav-line);background:var(--fav-soft)}
.cw .card{padding-right:48px}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;margin-top:10px}
.empty h3{font-size:1rem}
details.more{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.more summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:.95rem;list-style-position:inside}
details.more summary span{color:var(--muted);font-weight:500}
details.more .inner{padding:0 12px 12px}
.nofit-list{list-style:none;margin:0;padding:0 8px 8px}
.nofit-list button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:10px 8px;border-top:1px solid var(--line);font-size:.88rem;flex-wrap:wrap;border-radius:6px}
.nofit-list button:hover{background:var(--sunk)}
.nofit-list button:focus-visible{outline:2px solid var(--accent)}
.nofit-list .why{color:var(--bad);text-align:right}

/* ---------- Detail drawer ---------- */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slideIn .18s ease-out}
@keyframes slideIn{from{transform:translateX(28px)}to{transform:none}}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sh-nav{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--sunk)}
.iconbtn:disabled{opacity:.35;cursor:default;background:var(--surface)}
.iconbtn svg{width:16px;height:16px}
.favtoggle{margin-left:auto;margin-right:6px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.86rem;font-weight:700;cursor:pointer}
.favtoggle svg{width:15px;height:15px;color:var(--fav)}
.favtoggle:hover{border-color:var(--fav-line)}
.favtoggle[aria-pressed="true"]{background:var(--fav-soft);border-color:var(--fav-line);color:var(--fav)}
.sh-body{overflow-y:auto;padding:22px 24px 28px;display:grid;gap:20px;align-content:start}
.kind{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.vtag{font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.vtag.school{background:var(--school)} .vtag.college{background:var(--college)}
:root[data-theme="dark"] .vtag{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vtag{color:var(--bg)}}
.sh-body h2{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.sh-city{color:var(--muted);margin-top:4px;font-size:.95rem}
.status{border-radius:var(--r);padding:12px 14px;display:grid;gap:3px;font-size:.92rem}
.status b{font-size:.98rem;display:flex;gap:8px;align-items:center}
.status svg{width:16px;height:16px;flex-shrink:0}
.status.good{background:var(--good-soft);border:1px solid var(--good-line)} .status.good b{color:var(--good)}
.status.warn{background:var(--warn-soft);border:1px solid var(--warn-line)} .status.warn b{color:var(--warn)}
.status.bad{background:var(--bad-soft)} .status.bad b{color:var(--bad)}
.status.neutral{background:var(--sunk);border:1px solid var(--line)} .status.neutral b{color:var(--ink)}
.blk h3{font-size:.86rem;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:0;display:flex;gap:7px;align-items:center}
.blk h3 svg{width:15px;height:15px;color:var(--warn)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:.92rem}
.notes li{display:flex;gap:10px}
.notes li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line-2);margin-top:.62em;flex-shrink:0}
.notes.w li::before{background:var(--warn)}
dl.facts{margin:0;display:grid;grid-template-columns:110px 1fr;gap:0;font-size:.92rem;border-top:1px solid var(--line)}
dl.facts dt,dl.facts dd{padding:9px 0;border-bottom:1px solid var(--line)}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;min-width:0}
.signoff{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);margin-top:12px}
.signoff svg{width:12px;height:12px}
.signoff.flag{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.signoff.yes{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.stale{font-size:.72rem;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 7px;white-space:nowrap}
.tagy{font-size:.72rem;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:999px;padding:1px 7px;white-space:nowrap}
.hostlink{display:inline-flex;align-items:center;gap:8px;justify-self:start;font-weight:700;font-size:.92rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--ink)}
.hostlink:hover{border-color:var(--line-2);background:var(--sunk)}
.hostlink svg{width:14px;height:14px}

/* ---------- Shortlist ---------- */
.sl-head h1{font-size:clamp(1.7rem,3vw,2.2rem);font-weight:800;letter-spacing:-.03em;margin:8px 0 0}
.sl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.sl-col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0;box-shadow:var(--lift)}
.sl-col h2{font-size:1.02rem;display:flex;align-items:baseline;gap:8px}
.sl-col h2 span{font-weight:500;color:var(--muted);font-size:.88rem}
.sl-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-height:52px}
.sl-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.sl-row.dragging{opacity:.4}
.sl-row.over{box-shadow:0 -2px 0 var(--accent)}
.sl-list.drop-end{outline:2px dashed var(--accent);outline-offset:2px;border-radius:10px}
.sl-main{all:unset;cursor:pointer;flex:1;min-width:0;display:grid}
.sl-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sl-name{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--line-2)}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.rk{font-weight:800;font-size:1.05rem;width:24px;text-align:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.rk.over5{color:var(--warn)}
.grip{cursor:grab;color:var(--muted);flex-shrink:0;display:grid;place-items:center}
.grip svg{width:14px;height:14px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:30px;min-width:30px;padding:0 9px;font-size:.8rem;font-weight:700;cursor:pointer;display:inline-grid;place-items:center;flex-shrink:0;color:var(--ink)}
.mini:hover{background:var(--sunk)}
.mini:disabled{opacity:.35;cursor:default;background:var(--surface)}
.mini svg{width:13px;height:13px}
.mini.add{color:var(--accent)}
.tagr{font-size:.76rem;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.sl-note{font-size:.84rem;color:var(--warn);margin:0}
.sl-empty{font-size:.9rem;color:var(--muted);padding:16px;border:1px dashed var(--line-2);border-radius:10px;text-align:center;list-style:none}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);transition:opacity .2s,transform .2s}
#toast.out{opacity:0;transform:translate(-50%,6px)}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
footer p{margin:0}

@media (max-width:760px){
  .row.two,.row.three{grid-template-columns:1fr}
  .sl{grid-template-columns:1fr}
  .hero::before{display:none}
  .toolbar .f-path{max-width:none}
  .tb-end{margin-left:0}
  .toolbar .sep{display:none}
}
@media (max-width:640px){
  #sheet{top:auto;left:0;width:100%;max-height:88vh;border-radius:18px 18px 0 0;padding-left:env(safe-area-inset-left,0px);animation:sheetUp .2s ease-out}
  @keyframes sheetUp{from{transform:translateY(40px)}to{transform:none}}
  .view-btn small,.xw{display:none}
  .top{flex-wrap:nowrap}
  .brand b{font-size:1.05rem}
  .nav button{padding:7px 11px;font-size:.86rem}
  #nav-dest svg{display:none}
  .bar{position:static}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;align-items:end}
  .toolbar .f-path{grid-column:1/-1}
  .toolbar .f-sm{min-width:0}
  .tb-end{grid-column:1/-1;justify-content:flex-end}
}
@media (max-width:420px){
  .brand b{display:none}
  .view-btn .t{font-size:1rem}
  .go{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
